# Robots that can be targeted by the deploy tool.
# A robot can be addressed by its number, its name or any of its aliases (case-insensitive), or any of its IPs.
# All IPs of a robot are tried in parallel and the first reachable one is used.
#
# - name: Display name of the robot
#   number: Robot number
#   aliases: Optional additional names
#   ips: IP addresses of the robot

