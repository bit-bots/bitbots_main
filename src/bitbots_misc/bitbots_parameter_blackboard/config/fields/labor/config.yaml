# Settings for the test field

parameter_blackboard:
  ros__parameters:
    field:
      size:
        x: 5.0
        y: 3.87
        padding: 0.16   # Padding (area outside of the lines) of the field in all directions
      markings:
        penalty_area:
          size:
            x: 1.0   # The distance from the goal line to the boundary of the penalty area
      goal:
        width: 1.2   # The width of the goal (center of one goal post to the other goal post)
        depth: 0.16   # The depth of the goal (distance from the goal line to the back of the goal)

