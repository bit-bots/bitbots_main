[package]
name = "bitbots_orchestrate"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bitbots_orchestrate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bitbots_orchestrate_api = { path = "../api" }
bitbots_stack = { path = "../stack" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
r2r = "0.9"
serde_norway = "0.9"
