[package]
name = "teamplayer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teamplayer"
path = "src/main.rs"

[dependencies]
bitbots_orchestrate = { path = "../orchestrate" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
ansi-to-tui = "3"
clap = { version = "4", features = ["derive"] }
