[package]
name = "bitbots_compose_server"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bitbots_compose_server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bitbots_compose_api = { path = "../compose_api" }
bitbots_compose_file = { path = "../compose_file" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serde_norway = "0.9"
