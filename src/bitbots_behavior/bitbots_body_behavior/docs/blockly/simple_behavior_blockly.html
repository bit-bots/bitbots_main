<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Behavior Blockly (Dev)</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        display: grid;
        grid-template-rows: 60vh 40vh;
      }

      #workspacePanel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 36vw);
        min-height: 0;
      }

      #blocklyDiv {
        width: 100%;
        height: 100%;
      }

      #fieldPanel {
        padding: 0.75rem;
        background: #f4f4f4;
        border-left: 1px solid #ccc;
        overflow: auto;
      }

      #fieldHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      #fieldHeader h2 {
        margin: 0;
        font-size: 1rem;
      }

      #fieldDiagram {
        display: block;
        width: 100%;
        min-width: 290px;
        background: #16743a;
        border-radius: 0.25rem;
        touch-action: none;
        user-select: none;
      }

      #fieldPointer {
        cursor: grab;
        outline: none;
      }

      #fieldPointer:active {
        cursor: grabbing;
      }

      #fieldPointer:focus circle {
        stroke: #111;
        stroke-width: 4;
      }

      #fieldReadout {
        margin: 0.5rem 0 0;
        text-align: center;
        font-family: monospace;
        font-size: 1rem;
      }

      #fieldHelp {
        margin: 0.35rem 0 0;
        color: #444;
        font-size: 0.8rem;
        text-align: center;
      }

      #outputPanel {
        border-top: 1px solid #ccc;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      #outputHeader {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem;
      }

      #pythonOutput {
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0.75rem;
        box-sizing: border-box;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <section id="workspacePanel">
      <div id="blocklyDiv"></div>
      <aside id="fieldPanel">
        <div id="fieldHeader">
          <h2>Field coordinate lookup</h2>
          <label>
            Field
            <select id="fieldPreset"></select>
          </label>
        </div>
        <svg
          id="fieldDiagram"
          viewBox="0 0 800 520"
          role="img"
          aria-label="Football field coordinate reference with a draggable point"
        ></svg>
        <p id="fieldReadout" aria-live="polite">x = 0.00 m, y = 0.00 m</p>
        <p id="fieldHelp">Drag the yellow point. Arrow keys move it by 0.1 m. Positive x points right; positive y points up.</p>
      </aside>
    </section>
    <section id="outputPanel">
      <div id="outputHeader">
        <strong>Generated Python script</strong>
        <label for="runEndpoint">Run endpoint</label>
        <input id="runEndpoint" type="text" value="http://127.0.0.1:8765/run" size="34" />
        <button id="runButton" type="button">Run on robot</button>
        <button id="copyButton" type="button">Copy</button>
        <button id="downloadButton" type="button">Download</button>
        <span id="runStatus"></span>
      </div>
      <textarea id="pythonOutput" readonly></textarea>
    </section>

    <script src="vendor/blockly_compressed.js"></script>
    <script src="vendor/blocks_compressed.js"></script>
    <script src="vendor/python_compressed.js"></script>
    <script src="vendor/msg/en.js"></script>
    <script src="field_reference.js"></script>
    <script src="simple_behavior_blocks.js"></script>
  </body>
</html>
