move_head:
  # Max values for the head position
  max_acceleration_yaw:
    type: double
    default_value: 14.0
    description: "Max acceleration for yaw"
    validation:
      bounds<>: [-1, 20]

  max_acceleration_pitch:
    type: double
    default_value: 14.0
    description: "Max acceleration for pitch"
    validation:
      bounds<>: [-1, 20]

  max_yaw:
    type: double_array
    default_value: [-1.23, 1.23]
    description: "Max values for the head position (in radians)"
    validation:
      fixed_size<>: 2
      element_bounds<>: [-3.14, 3.14]

  max_pitch:
    type: double_array
    default_value: [-1.23, 1.01]
    description: "Max values for the head position (in radians)"
    validation:
      fixed_size<>: 2

  transition_speed:
    type: double
    default_value: 6.0
    description: "Speed (in rad/s) used to smoothly transition from the current head position into a new search pattern when the head mode changes"
    validation:
      bounds<>: [0.1, 10.0]

  look_at:
    pitch_speed:
      type: double
      default_value: 6.0
      description: "pitch speed for the look at action"
      validation:
        bounds<>: [0.0, 8.0]
    yaw_speed:
      type: double
      default_value: 6.0
      description: "yaw speed for the look at action"
      validation:
        bounds<>: [0.0, 8.0]

  # Search pattern for ball
  search_patterns:
    search_ball_penalty:
      cycle_time:
        type: double
        description: "Duration of one full search pattern cycle in seconds"
        default_value: 5.0
        validation:
          gt<>: [0.0]

      yaw_max:
        type: double_array
        default_value: [-30.0, 30.0]
        description: "Maximum yaw values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      pitch_max:
        type: double_array
        default_value: [-5.0, 35.0]
        description: "Maximum pitch values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      scan_lines:
        type: int
        default_value: 2
        description: "Number of scan horizontal lines for the search pattern"
        validation:
          gt_eq<>: [1]

      reduce_last_scanline:
        type: double
        default_value: 0.2
        description: "Reduces last scanline by that factor so that robot does not collide"
        validation:
          bounds<>: [0.0, 1.0]

    search_field_features:
      cycle_time:
        type: double
        description: "Duration of one full search pattern cycle in seconds"
        default_value: 2.0
        validation:
          gt<>: [0.0]

      yaw_max:
        type: double_array
        default_value: [-70.0, 70.0]
        description: "Maximum yaw values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      pitch_max:
        type: double_array
        default_value: [-5.0, 35.0]
        description: "Maximum pitch values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      scan_lines:
        type: int
        default_value: 2
        description: "Number of scan horizontal lines for the search pattern"
        validation:
          gt_eq<>: [1]

      reduce_last_scanline:
        type: double
        default_value: 0.4
        description: "Reduces last scanline by that factor so that robot does not collide"
        validation:
          bounds<>: [0.0, 1.0]

    search_front:
      cycle_time:
        type: double
        description: "Duration of one full search pattern cycle in seconds"
        default_value: 1.0
        validation:
          gt<>: [0.0]

      yaw_max:
        type: double_array
        default_value: [0.0, 0.0]
        description: "Maximum yaw values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      pitch_max:
        type: double_array
        default_value: [-5.0, 35.0]
        description: "Maximum pitch values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      scan_lines:
        type: int
        default_value: 2
        description: "Number of scan horizontal lines for the search pattern"
        validation:
          gt_eq<>: [1]

      reduce_last_scanline:
        type: double
        default_value: 0.0
        description: "Reduces last scanline by that factor so that robot does not collide"
        validation:
          bounds<>: [0.0, 1.0]

    look_forward:
      cycle_time:
        type: double
        description: "Duration of one full search pattern cycle in seconds"
        default_value: 3.0
        validation:
          gt<>: [0.0]

      yaw_max:
        type: double_array
        default_value: [0.0, 0.0]
        description: "Maximum yaw values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      pitch_max:
        type: double_array
        default_value: [0.0, 0.0]
        description: "Maximum pitch values for the search pattern (in degrees)"
        validation:
          fixed_size<>: 2

      scan_lines:
        type: int
        default_value: 2
        description: "Number of scan horizontal lines for the search pattern"
        validation:
          gt_eq<>: [1]

      reduce_last_scanline:
        type: double
        default_value: 0.0
        description: "Reduces last scanline by that factor so that robot does not collide"
        validation:
          bounds<>: [0.0, 1.0]


  # Sampling based head control used by the ACTIVE_VISION head mode
  active_vision:
    root_link:
      type: string
      default_value: "base_link"
      description: "Link the sampled camera poses are resolved against. The map to this link transform places the robot on the field."

    tip_link:
      type: string
      default_value: "camera_optical_frame_left_uncalibrated"
      description: "Optical frame at the end of the head chain, as named in the robot description"

    calibrated_optical_frame:
      type: string
      default_value: "zed_left_camera_optical_frame"
      description: "Optical frame the vision pipeline reports detections in. The offset from tip_link is the extrinsic calibration and is looked up via tf."

    map_frame:
      type: string
      default_value: "map"
      description: "Frame the field, the coverage map and all stored detections live in"

    max_velocity_yaw:
      type: double
      default_value: 4.0
      description: "Maximum yaw speed the controller commands while steering the head towards the target. Deliberately below the motor's mechanical limit."
      validation:
        gt<>: [0.0]

    max_velocity_pitch:
      type: double
      default_value: 4.0
      description: "Maximum pitch speed the controller commands while steering the head towards the target"
      validation:
        gt<>: [0.0]

    controller:
      approach_distance:
        type: double
        default_value: 0.3
        description: "Joint space distance (radians) within which the controller ramps the head speed down linearly from the maximum to zero, so the head glides to a stop on the target. Beyond it the head travels at full speed."
        validation:
          gt<>: [0.0]

      control_period:
        type: double
        default_value: 0.05
        description: "Time step (seconds) the controller advances the setpoint by each cycle. Should match the control loop period."
        validation:
          gt<>: [0.0]

    sampling:
      sample_count:
        type: int
        default_value: 64
        description: "Number of candidate targets drawn per planning cycle"
        validation:
          gt_eq<>: [1]

      last_target_weight:
        type: double
        default_value: 0.1
        description: "Relative share of the samples drawn from a gaussian around the previously selected target. Folded into the current position share until a first target exists. The three sampling weights are normalized, so only their ratio matters."
        validation:
          gt_eq<>: [0.0]

      current_position_weight:
        type: double
        default_value: 0.3
        description: "Relative share of the samples drawn from a gaussian around the current head position"
        validation:
          gt_eq<>: [0.0]

      uniform_weight:
        type: double
        default_value: 0.3
        description: "Relative share of the samples drawn uniformly over the reachable range, which keeps the search exploring the rest of the field"
        validation:
          gt_eq<>: [0.0]

      last_target_std:
        type: double
        default_value: 0.3
        description: "Standard deviation (radians) of the gaussian drawn around the last target"
        validation:
          gt<>: [0.0]

      current_position_std:
        type: double
        default_value: 0.5
        description: "Standard deviation (radians) of the gaussian drawn around the current head position"
        validation:
          gt<>: [0.0]

      random_seed:
        type: int
        default_value: 42
        description: "Seed of the sampling random number generator, so runs are reproducible"

    visibility:
      center_fraction:
        type: double
        default_value: 0.3
        description: "Fraction of the image around its center that counts as perfectly framed"
        validation:
          bounds<>: [0.0, 1.0]

      border_score:
        type: double
        default_value: 0.3
        description: "Score of a target sitting exactly on the image border. Targets outside the image always score zero."
        validation:
          bounds<>: [0.0, 1.0]

    coverage:
      margin:
        type: double
        default_value: 1.0
        description: "How far beyond the field lines the coverage map extends. This area carries the out of field penalty."
        validation:
          gt_eq<>: [0.0]

      cell_size:
        type: double
        default_value: 1.0
        description: "Edge length of a coverage map cell. Smaller cells are more precise but cost planning time, as every cell is projected into the camera for every evaluated point of every candidate."
        validation:
          gt<>: [0.0]

      half_life:
        type: double
        default_value: 0.5
        description: "Time after which having observed a part of the field counts for half as much, making it worth revisiting"
        validation:
          gt<>: [0.0]

      distance_half_weight:
        type: double
        default_value: 0.5
        description: "Ground distance at which a field cell counts half as much for coverage. A patch twice as far away covers about a quarter of the image, so without this falloff the coverage term would reward distant overview poses where a ball is barely detectable."
        validation:
          gt<>: [0.0]

    timeouts:
      filtered_ball:
        type: double
        default_value: 5.0
        description: "How long the filtered ball estimate stays relevant"
        validation:
          gt<>: [0.0]

      raw_ball:
        type: double
        default_value: 0.5
        description: "How long a raw ball detection stays relevant"
        validation:
          gt<>: [0.0]

      team_ball:
        type: double
        default_value: 1.0
        description: "How long a ball reported by a teammate stays relevant"
        validation:
          gt<>: [0.0]

      robot:
        type: double
        default_value: 1.0
        description: "How long a robot detection stays relevant"
        validation:
          gt<>: [0.0]

    covariance_half_weight:
      type: double
      default_value: 0.5
      description: "Covariance at which a filtered estimate's contribution has dropped to half"
      validation:
        gt<>: [0.0]

    weights:
      filtered_ball:
        type: double
        default_value: 1.5
        description: "Importance of keeping the filtered ball estimate in view"
        validation:
          gt_eq<>: [0.0]

      raw_balls:
        type: double
        default_value: 0.0
        description: "Importance of keeping the raw ball detections in view"
        validation:
          gt_eq<>: [0.0]

      team_ball:
        type: double
        default_value: 0.0
        description: "Importance of keeping a ball reported by a teammate in view"
        validation:
          gt_eq<>: [0.0]

      field_coverage:
        type: double
        default_value: 2.0
        description: "Importance of looking at parts of the field that were not observed recently"
        validation:
          gt_eq<>: [0.0]

      robots:
        type: double
        default_value: 0.1
        description: "Importance of keeping detected robots in view"
        validation:
          gt_eq<>: [0.0]


      smoothness:
        type: double
        default_value: 0.1
        description: "Cost per radian of joint space distance between a candidate target and the previously selected one, subtracted from the score. This is the knob that trades reactivity against steady head motion: a larger value keeps the head from jumping between equally attractive parts of the field."
        validation:
          gt_eq<>: [0.0]

    debug:
      enabled:
        type: bool
        default_value: true
        description: "Publish the coverage grid, candidate markers and the joint space score image"

      image_size:
        type: int
        default_value: 400
        description: "Edge length in pixels of the joint space debug image"
        validation:
          gt_eq<>: [64]
