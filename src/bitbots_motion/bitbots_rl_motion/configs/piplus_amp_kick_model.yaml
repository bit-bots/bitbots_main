# Configuration of the Pi Plus AMP soccer kick policy.
#
# Training: repository AMP_mjlab (worktree AMP_mjlab-kick-noballvel, branch amp-soccer-kick),
# task PiPlus-AMP-Kick-DA, run piplus_amp_kick_symmetric/2026-11-02_21-25-35_kick_sym_huber,
# checkpoint model_29000.pt (iteration 29000). Do not use model_29999.pt of this run: the
# training became numerically unstable at about iteration 29467.
# The joint order, default pose, gains, action scale, joint ranges, history length and
# control period come from the env.yaml of this run and from the robot model of the training.
# The policy was trained in simulation only.
# See the "Pi Plus AMP walk and kick policies" page in bitbots_docs.
piplus_amp_kick_node:
  ros__parameters:
    model: piplus_amp_kick.onnx

    joints:
      ordered_relevant_joint_names: [
        "r_shoulder_pitch_joint",
        "r_shoulder_roll_joint",
        "r_upper_arm_joint",
        "r_elbow_joint",
        "l_shoulder_pitch_joint",
        "l_shoulder_roll_joint",
        "l_upper_arm_joint",
        "l_elbow_joint",
        "r_hip_pitch_joint",
        "r_hip_roll_joint",
        "r_thigh_joint",
        "r_calf_joint",
        "r_ankle_pitch_joint",
        "r_ankle_roll_joint",
        "l_hip_pitch_joint",
        "l_hip_roll_joint",
        "l_thigh_joint",
        "l_calf_joint",
        "l_ankle_pitch_joint",
        "l_ankle_roll_joint",
      ]
      # Default pose of the training task. The policy observes the joint positions
      # relative to this pose and adds its scaled action to this pose.
      walkready_state: [
        -1.3329,  # r_shoulder_pitch_joint
        -1.0420,  # r_shoulder_roll_joint
        -0.5610,  # r_upper_arm_joint
        -1.0056,  # r_elbow_joint
         1.3329,  # l_shoulder_pitch_joint
         1.0420,  # l_shoulder_roll_joint
         0.5610,  # l_upper_arm_joint
         1.0055,  # l_elbow_joint
         0.5311,  # r_hip_pitch_joint
        -0.0981,  # r_hip_roll_joint
         0.1370,  # r_thigh_joint
         0.6787,  # r_calf_joint
         0.1294,  # r_ankle_pitch_joint
         0.0000,  # r_ankle_roll_joint
        -0.5311,  # l_hip_pitch_joint
         0.0981,  # l_hip_roll_joint
        -0.1370,  # l_thigh_joint
        -0.6787,  # l_calf_joint
        -0.1294,  # l_ankle_pitch_joint
         0.0000,  # l_ankle_roll_joint
      ]
      kp: [
        6.0,  # r_shoulder_pitch_joint
        6.0,  # r_shoulder_roll_joint
        6.0,  # r_upper_arm_joint
        6.0,  # r_elbow_joint
        6.0,  # l_shoulder_pitch_joint
        6.0,  # l_shoulder_roll_joint
        6.0,  # l_upper_arm_joint
        6.0,  # l_elbow_joint
        50.0,  # r_hip_pitch_joint
        50.0,  # r_hip_roll_joint
        50.0,  # r_thigh_joint
        50.0,  # r_calf_joint
        50.0,  # r_ankle_pitch_joint
        50.0,  # r_ankle_roll_joint
        50.0,  # l_hip_pitch_joint
        50.0,  # l_hip_roll_joint
        50.0,  # l_thigh_joint
        50.0,  # l_calf_joint
        50.0,  # l_ankle_pitch_joint
        50.0,  # l_ankle_roll_joint
      ]
      kd: [
        0.60,  # r_shoulder_pitch_joint
        0.60,  # r_shoulder_roll_joint
        0.60,  # r_upper_arm_joint
        0.60,  # r_elbow_joint
        0.60,  # l_shoulder_pitch_joint
        0.60,  # l_shoulder_roll_joint
        0.60,  # l_upper_arm_joint
        0.60,  # l_elbow_joint
        1.10,  # r_hip_pitch_joint
        1.40,  # r_hip_roll_joint
        1.10,  # r_thigh_joint
        1.10,  # r_calf_joint
        1.10,  # r_ankle_pitch_joint
        1.10,  # r_ankle_roll_joint
        1.10,  # l_hip_pitch_joint
        1.40,  # l_hip_roll_joint
        1.10,  # l_thigh_joint
        1.10,  # l_calf_joint
        1.10,  # l_ankle_pitch_joint
        1.10,  # l_ankle_roll_joint
      ]
      action_scales: [
        0.1000,  # r_shoulder_pitch_joint
        0.1000,  # r_shoulder_roll_joint
        0.1000,  # r_upper_arm_joint
        0.1000,  # r_elbow_joint
        0.1000,  # l_shoulder_pitch_joint
        0.1000,  # l_shoulder_roll_joint
        0.1000,  # l_upper_arm_joint
        0.1000,  # l_elbow_joint
        0.1000,  # r_hip_pitch_joint
        0.1000,  # r_hip_roll_joint
        0.1000,  # r_thigh_joint
        0.1000,  # r_calf_joint
        0.1000,  # r_ankle_pitch_joint
        0.1000,  # r_ankle_roll_joint
        0.1000,  # l_hip_pitch_joint
        0.1000,  # l_hip_roll_joint
        0.1000,  # l_thigh_joint
        0.1000,  # l_calf_joint
        0.1000,  # l_ankle_pitch_joint
        0.1000,  # l_ankle_roll_joint
      ]
      # Joint ranges of the training model (piplus.xml). The joint targets are clipped
      # to these ranges, shrunk around their centers by soft_limit_factor (the
      # soft_joint_pos_limit_factor of the training).
      soft_limit_factor: 0.9
      position_limits_lower: [
        -2.5500,  # r_shoulder_pitch_joint
        -1.6500,  # r_shoulder_roll_joint
        -2.5500,  # r_upper_arm_joint
        -1.8000,  # r_elbow_joint
        -2.5500,  # l_shoulder_pitch_joint
        -1.4000,  # l_shoulder_roll_joint
        -2.5500,  # l_upper_arm_joint
        -2.0400,  # l_elbow_joint
        -2.8400,  # r_hip_pitch_joint
        -1.0000,  # r_hip_roll_joint
        -2.7700,  # r_thigh_joint
        -1.9700,  # r_calf_joint
        -0.9500,  # r_ankle_pitch_joint
        -0.7200,  # r_ankle_roll_joint
        -2.8400,  # l_hip_pitch_joint
        -0.1500,  # l_hip_roll_joint
        -2.7700,  # l_thigh_joint
        -2.2100,  # l_calf_joint
        -0.8500,  # l_ankle_pitch_joint
        -0.7200,  # l_ankle_roll_joint
      ]
      position_limits_upper: [
         2.5500,  # r_shoulder_pitch_joint
         1.4000,  # r_shoulder_roll_joint
         2.5500,  # r_upper_arm_joint
         2.0400,  # r_elbow_joint
         2.5500,  # l_shoulder_pitch_joint
         1.6500,  # l_shoulder_roll_joint
         2.5500,  # l_upper_arm_joint
         1.8000,  # l_elbow_joint
         2.8400,  # r_hip_pitch_joint
         0.1500,  # r_hip_roll_joint
         2.4500,  # r_thigh_joint
         2.2100,  # r_calf_joint
         0.8500,  # r_ankle_pitch_joint
         0.7200,  # r_ankle_roll_joint
         2.8400,  # l_hip_pitch_joint
         1.0000,  # l_hip_roll_joint
         2.4500,  # l_thigh_joint
         1.9700,  # l_calf_joint
         0.9500,  # l_ankle_pitch_joint
         0.7200,  # l_ankle_roll_joint
      ]
      # Bound for the last action in the observation. The training does not bound it.
      # This value is much larger than the actions of the trained policy. It only stops
      # a feedback loop that diverges.
      action_limit: 50.0

    phase:
      # The policy runs at the control rate of the training task
      control_dt: 0.02
      gait_frequency: 0.0
      use_phase: False

    obs:
      # Number of frames in the observation history (time-major order)
      history_length: 4

    ball:
      topic: ball_position_relative_filtered
      # The policy observes the ball position in this frame (anchor body of the training)
      anchor_frame: torso_link
      # A ball estimate older than this time in seconds is not available
      timeout: 0.5
      # A ball estimate with a larger x or y variance is not available.
      # This is the same value as ball_max_covariance of the behavior.
      max_covariance: 2.0
      # The training clips each axis of the ball position to this value in meters
      position_clip: 10.0
      # Scale in meters of the tanh bound of the ball position: each axis becomes
      # s * tanh(x / s) after the clip. Null turns the bound off. The value must agree with
      # the training of the model. The current model (kick_sym_huber, model_29000) was
      # trained without the bound, so the value must stay null for it. Runs with the
      # bound (for example kick_sym_huber_coeff01_rest05_tanh) need the value of their
      # training (BALL_POS_TANH_SCALE_M).
      pos_tanh_scale: null

    command:
      action_name: rl_kick
      # Duration in seconds of a kick goal without its own timeout
      kick_timeout: 4.0
      # Maximum kick intensity. The strength of a kick goal (target ball speed in m/s)
      # is converted to an intensity in [0, 1] and clipped to this value.
      max_kick_intensity: 1.0
      # The kick direction is anchored in the odom frame and observed in the yaw frame
      # of the base frame
      odom_frame: odom
      base_frame: base_footprint

    providers: ["CPUExecutionProvider"]
