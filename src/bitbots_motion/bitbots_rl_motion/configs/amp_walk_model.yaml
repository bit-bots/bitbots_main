# Configuration of the AMP locomotion policy, trained with mjlab on the HighTorque Pi Plus.
#
# The joint order, the default pose, the gains and the action scale are the ones of
# the training task. The policy observes the joints relative to the default pose and
# its action is added on top of the same pose, scaled by the action scale.
#
# The shipped policy was exported from the AMP_mjlab run
# piplus_amp_locomotion/2026-08-05_23-51-43 (100000 iterations).
# Every value below was taken from the env.yaml that run recorded for itself.
amp_walk_node:
  ros__parameters:
    model: amp_walk.onnx

    joints:
      ordered_relevant_joint_names: [
        "r_shoulder_pitch_joint",
        "r_shoulder_roll_joint",
        "r_upper_arm_joint",
        "r_elbow_joint",
        "l_shoulder_pitch_joint",
        "l_shoulder_roll_joint",
        "l_upper_arm_joint",
        "l_elbow_joint",
        "r_hip_pitch_joint",
        "r_hip_roll_joint",
        "r_thigh_joint",
        "r_calf_joint",
        "r_ankle_pitch_joint",
        "r_ankle_roll_joint",
        "l_hip_pitch_joint",
        "l_hip_roll_joint",
        "l_thigh_joint",
        "l_calf_joint",
        "l_ankle_pitch_joint",
        "l_ankle_roll_joint",
      ]
      # Default pose of the training task, which is the mean pose of the motion dataset
      walkready_state: [
        1.2902,  # r_shoulder_pitch_joint
        1.1479,  # r_shoulder_roll_joint
        -0.1694,  # r_upper_arm_joint
        1.8082,  # r_elbow_joint
        -1.3218,  # l_shoulder_pitch_joint
        -1.0850,  # l_shoulder_roll_joint
        0.1584,  # l_upper_arm_joint
        -1.9507,  # l_elbow_joint
        0.6691,  # r_hip_pitch_joint
        -0.1417,  # r_hip_roll_joint
        0.1645,  # r_thigh_joint
        1.0644,  # r_calf_joint
        0.1619,  # r_ankle_pitch_joint
        0.0000,  # r_ankle_roll_joint
        -0.6540,  # l_hip_pitch_joint
        0.1116,  # l_hip_roll_joint
        -0.1363,  # l_thigh_joint
        -1.0866,  # l_calf_joint
        -0.1045,  # l_ankle_pitch_joint
        0.0000,  # l_ankle_roll_joint
      ]
      kp: [
        6.0,  # r_shoulder_pitch_joint
        6.0,  # r_shoulder_roll_joint
        6.0,  # r_upper_arm_joint
        6.0,  # r_elbow_joint
        6.0,  # l_shoulder_pitch_joint
        6.0,  # l_shoulder_roll_joint
        6.0,  # l_upper_arm_joint
        6.0,  # l_elbow_joint
        50.0,  # r_hip_pitch_joint
        50.0,  # r_hip_roll_joint
        50.0,  # r_thigh_joint
        50.0,  # r_calf_joint
        50.0,  # r_ankle_pitch_joint
        50.0,  # r_ankle_roll_joint
        50.0,  # l_hip_pitch_joint
        50.0,  # l_hip_roll_joint
        50.0,  # l_thigh_joint
        50.0,  # l_calf_joint
        50.0,  # l_ankle_pitch_joint
        50.0,  # l_ankle_roll_joint
      ]
      kd: [
        0.6,  # r_shoulder_pitch_joint
        0.6,  # r_shoulder_roll_joint
        0.6,  # r_upper_arm_joint
        0.6,  # r_elbow_joint
        0.6,  # l_shoulder_pitch_joint
        0.6,  # l_shoulder_roll_joint
        0.6,  # l_upper_arm_joint
        0.6,  # l_elbow_joint
        1.1,  # r_hip_pitch_joint
        1.4,  # r_hip_roll_joint
        1.1,  # r_thigh_joint
        1.1,  # r_calf_joint
        1.1,  # r_ankle_pitch_joint
        1.1,  # r_ankle_roll_joint
        1.1,  # l_hip_pitch_joint
        1.4,  # l_hip_roll_joint
        1.1,  # l_thigh_joint
        1.1,  # l_calf_joint
        1.1,  # l_ankle_pitch_joint
        1.1,  # l_ankle_roll_joint
      ]
      action_scales: [
        0.10,  # r_shoulder_pitch_joint
        0.10,  # r_shoulder_roll_joint
        0.10,  # r_upper_arm_joint
        0.10,  # r_elbow_joint
        0.10,  # l_shoulder_pitch_joint
        0.10,  # l_shoulder_roll_joint
        0.10,  # l_upper_arm_joint
        0.10,  # l_elbow_joint
        0.10,  # r_hip_pitch_joint
        0.10,  # r_hip_roll_joint
        0.10,  # r_thigh_joint
        0.10,  # r_calf_joint
        0.10,  # r_ankle_pitch_joint
        0.10,  # r_ankle_roll_joint
        0.10,  # l_hip_pitch_joint
        0.10,  # l_hip_roll_joint
        0.10,  # l_thigh_joint
        0.10,  # l_calf_joint
        0.10,  # l_ankle_pitch_joint
        0.10,  # l_ankle_roll_joint
      ]
      # Hard joint limits of the robot. The commanded position is clamped to them, so a
      # policy that asks for a pose the joint can not reach drives the joint against its
      # end stop instead of being commanded past it. The simulation does not clamp the
      # target either, but there the joint range stops the joint in the physics, which a
      # real robot only does mechanically. The factor shrinks the allowed range around
      # its center, matching how the training penalized leaving the range.
      soft_limit_factor: 1.0
      # The policy produced actions of about unit scale during training, so this only
      # binds when it is fed something it has never seen
      action_limit: 10.0
      position_limits_lower: [
        -2.5500,  # r_shoulder_pitch_joint
        -1.6500,  # r_shoulder_roll_joint
        -2.5500,  # r_upper_arm_joint
        -1.8000,  # r_elbow_joint
        -2.5500,  # l_shoulder_pitch_joint
        -1.4000,  # l_shoulder_roll_joint
        -2.5500,  # l_upper_arm_joint
        -2.0400,  # l_elbow_joint
        -2.8400,  # r_hip_pitch_joint
        -3.1000,  # r_hip_roll_joint
        -2.7700,  # r_thigh_joint
        -1.9700,  # r_calf_joint
        -0.9500,  # r_ankle_pitch_joint
        -0.7200,  # r_ankle_roll_joint
        -2.8400,  # l_hip_pitch_joint
        -0.1500,  # l_hip_roll_joint
        -2.7700,  # l_thigh_joint
        -2.2100,  # l_calf_joint
        -0.8500,  # l_ankle_pitch_joint
        -0.7200,  # l_ankle_roll_joint
      ]
      position_limits_upper: [
        2.5500,  # r_shoulder_pitch_joint
        1.4000,  # r_shoulder_roll_joint
        2.5500,  # r_upper_arm_joint
        2.0400,  # r_elbow_joint
        2.5500,  # l_shoulder_pitch_joint
        1.6500,  # l_shoulder_roll_joint
        2.5500,  # l_upper_arm_joint
        1.8000,  # l_elbow_joint
        2.8400,  # r_hip_pitch_joint
        0.1500,  # r_hip_roll_joint
        2.4500,  # r_thigh_joint
        2.2100,  # r_calf_joint
        0.8500,  # r_ankle_pitch_joint
        0.7200,  # r_ankle_roll_joint
        2.8400,  # l_hip_pitch_joint
        3.1000,  # l_hip_roll_joint
        2.4500,  # l_thigh_joint
        1.9700,  # l_calf_joint
        0.9500,  # l_ankle_pitch_joint
        0.7200,  # l_ankle_roll_joint
      ]

    phase:
      # The policy is run at 50 Hz, matching the control rate of the training task
      control_dt: 0.02
      gait_frequency: 0.0
      use_phase: False

    obs:
      # Number of stacked frames the policy observes, matching the history length of
      # the observation group of the training task
      history_length: 4

    debug:
      # Publish the observation and the action for offline comparison against the
      # distribution the policy was trained on
      publish_observation: true

    providers: ["CPUExecutionProvider"]
