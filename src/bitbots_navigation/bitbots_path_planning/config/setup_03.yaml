# Boundary walls keeping the robot inside the -2..+2 m range (x and y).
# Each wall is a 10 cm thick box whose inner edge lies exactly at +/-2 m;
# the 4.2 m length lets the walls overlap at the corners so there are no gaps.

frame: map

obstacles:
  - {type: box, x: 2.15, y: 0.0, size_x: 0.1, size_y: 4.4, yaw: 0.0, height: 1.0}
  - {type: box, x: -2.15, y: 0.0, size_x: 0.1, size_y: 4.4, yaw: 0.0, height: 1.0}
  - {type: box, x: 0.0, y: 2.15, size_x: 4.4, size_y: 0.1, yaw: 0.0, height: 1.0}
  - {type: box, x: 0.0, y: -2.15, size_x: 4.4, size_y: 0.1, yaw: 0.0, height: 1.0}

  - {type: box, x: 1.0, y: -1.5, size_x: 0.4, size_y: 0.6, yaw: 0.0, height: 0.3}
  - {type: box, x: 1.0, y: -0.5, size_x: 0.4, size_y: 0.6, yaw: 0.0, height: 0.3}
  - {type: box, x: 1.0, y: 0.5, size_x: 0.4, size_y: 0.6, yaw: 0.0, height: 0.3}

  - {type: box, x: -1.0, y: -0.5, size_x: 0.4, size_y: 0.6, yaw: 0.0, height: 0.3}
  - {type: box, x: -1.0, y: 0.5, size_x: 0.4, size_y: 0.6, yaw: 0.0, height: 0.3}
  - {type: box, x: -1.0, y: 1.5, size_x: 0.4, size_y: 0.6, yaw: 0.0, height: 0.3}
