name: Build & Test
on:
  schedule:
    - cron: '12 3 * * *'
  push:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      PSModulePath: ""  # Otherwise colcon might think that PowerShell is being used

    steps:
      - name: Cancel outdated jobs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: 'true'

      # Remove comments to spawn an interactive debugging ssh shell in the ci
      # - name: Setup upterm session
      #   uses: owenthereal/action-upterm@v2
      #   with:
      #     detached: true
      #     limit-access-to-actor: true

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure git to trust repository
        run: git config --global --add safe.directory /__w/bitbots_main/bitbots_main

      - name: Set up workspace
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.toml', 'pixi.lock') }}-

      - name: Build
        run: pixi run -e default build

      - name: Start ZenohD
        run: pixi run -e default ros2 run rmw_zenoh_cpp rmw_zenohd &

      - name: Test
        run: pixi run -e default test

      - name: Test deploy scripts
        run: pixi run -e default pytest scripts/deploy/tests
