name: Build benchmark

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      PSModulePath: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure git to trust repository
        run: git config --global --add safe.directory /__w/bitbots_main/bitbots_main

      - name: Set up workspace
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          cache: true
          cache-key: pixi-${{ hashFiles('pixi.toml', 'pixi.lock') }}-

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Measure clean and incremental builds
        run: >-
          python3 scripts/benchmark_build.py
          --task build-robot-profile
          --output build-benchmark-${{ runner.arch }}.json

      - name: Show compiler cache statistics
        if: always()
        run: pixi run -e default ccache --show-stats

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-benchmark-${{ runner.arch }}
          path: build-benchmark-${{ runner.arch }}.json
          if-no-files-found: warn
